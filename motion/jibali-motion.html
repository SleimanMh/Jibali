<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Jibali motion</title>
<style>
  @font-face { font-family: "Amiri"; src: local("Amiri"), url("file:///usr/share/fonts/opentype/fonts-hosny-amiri/Amiri-Regular.ttf"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Jibali — illustrated heritage film, scenes 01-05 (0-17 s).
   Pure function of time: render(t) draws the frame at t seconds.
   Scene 06 (17-20 s) is the real product photo, rendered separately. */
const W = 1080, H = 1920;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const C = {
  green: "#2D6560", deep: "#173C39", ink: "#0F2624",
  gold: "#CEA273", gold2: "#E8C890", cream: "#FFF5EA",
  wheat: "#D9A852", wheatDark: "#A87A35", roof: "#B5543A",
  stone: "#D8CDB8", stoneDark: "#A99C86",
  buff: "#D99A5B", buffDark: "#B97A3F", black: "#1B1A18", white: "#F4EEE4",
  flour: "#F1E6D2", dough: "#E7CFA6", wood: "#7A4E2D", woodDark: "#5A3720",
};

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * clamp(t));
const easeOut = t => Math.sin(Math.PI / 2 * clamp(t));
const easeIn = t => 1 - Math.cos(Math.PI / 2 * clamp(t));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise1(x, seed = 1) { // smooth value noise
  const h = n => { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); };
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(h(i), h(i + 1), u);
}
const fbm = (x, seed) => noise1(x, seed) * 0.55 + noise1(x * 2.1, seed + 7) * 0.28 + noise1(x * 4.3, seed + 13) * 0.17;

function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function camera(scale, cx = W / 2, cy = H / 2) { ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy); }

/* paper grain + vignette, made once */
const grain = document.createElement("canvas"); grain.width = W; grain.height = H;
(() => { const g = grain.getContext("2d"); const id = g.createImageData(W, H); const r = rng(9);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() - 0.5) * 60; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); })();
function finish(alphaGrain = 0.06) {
  ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = alphaGrain; ctx.drawImage(grain, 0, 0); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.5, H * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.42)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* small Arabic scene word, gold, fades in and out */
function word(text, lt, dur) {
  const a = clamp(lt / 0.5) * clamp((dur - lt) / 0.4);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a * 0.95;
  ctx.font = "64px Amiri"; ctx.fillStyle = C.gold2; ctx.textAlign = "center"; ctx.direction = "rtl";
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 18;
  ctx.fillText(text, W / 2, 330);
  ctx.fillStyle = C.gold; ctx.fillRect(W / 2 - 40, 362, 80, 2);
  ctx.restore();
}

/* ---------- the hoopoe ---------- */
/* Local coords: bird faces +x, ~150 units long. flap: wing angle in radians (+ = up).
   fold: 0 flying .. 1 wings folded. crest: 0 flat .. 1 fanned. */
function stripedWing(len, wid, bars) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(len * 0.25, -wid * 0.9, len * 0.85, -wid * 0.75, len, -wid * 0.15);
  ctx.bezierCurveTo(len * 1.02, wid * 0.35, len * 0.6, wid * 0.45, 0, wid * 0.2);
  ctx.closePath();
  ctx.fillStyle = C.black; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = C.white;
  for (let i = 0; i < bars; i++) { const x = len * (0.28 + i * 0.17); ctx.fillRect(x, -wid, len * 0.07, wid * 2); }
  ctx.restore();
}
function hoopoe(x, y, s, o) {
  const { flap = 0, fold = 0, crest = 0.3, tilt = 0, legs = 0, dir = 1 } = o;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s); ctx.rotate(tilt);
  // far wing (flying only)
  if (fold < 1) {
    const a2 = 0.45 + (1 - clamp(flap - 0.12, -1, 1)) * 0.85;
    ctx.save(); ctx.globalAlpha = 1 - fold; ctx.translate(2, -10); ctx.rotate(-Math.PI / 2 - a2);
    ctx.scale(1, 0.9); ctx.filter = "brightness(0.7)"; stripedWing(74 * (1 - fold * 0.5), 30, 4); ctx.filter = "none"; ctx.restore();
  }
  // legs
  if (legs > 0) {
    ctx.strokeStyle = "#5B4A3B"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.globalAlpha = legs;
    ctx.beginPath(); ctx.moveTo(-2, 14); ctx.lineTo(-6, 34); ctx.lineTo(-12, 36); ctx.moveTo(6, 14); ctx.lineTo(8, 34); ctx.lineTo(2, 36); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // tail
  ctx.save(); ctx.translate(-30, 2); ctx.rotate(0.12 + fold * 0.18);
  ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(-46, -8); ctx.quadraticCurveTo(-50, 0, -46, 8); ctx.lineTo(0, 7); ctx.closePath();
  ctx.fillStyle = C.black; ctx.fill(); ctx.fillStyle = C.white; ctx.fillRect(-26, -9, 6, 18); ctx.restore();
  // body
  ctx.beginPath(); ctx.ellipse(0, 0, 34, 17, -0.06, 0, Math.PI * 2);
  const bg = ctx.createLinearGradient(0, -17, 0, 17); bg.addColorStop(0, C.buff); bg.addColorStop(1, C.buffDark);
  ctx.fillStyle = bg; ctx.fill();
  // folded wing on body
  if (fold > 0) {
    ctx.save(); ctx.globalAlpha = fold; ctx.translate(14, -6); ctx.rotate(Math.PI + 0.08); stripedWing(50, 13, 4); ctx.restore();
  }
  // crest (behind head)
  const fan = 0.35 + crest * 0.65;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * (0.55 + (i / 6 - 0.5) * 0.75 * fan) - 0.25 * (1 - crest);
    const L = 18 + crest * 14 - Math.abs(i - 3) * 1.5;
    ctx.save(); ctx.translate(36, -16); ctx.rotate(a + Math.PI / 2 - 0.9 + (1 - crest) * -0.5);
    ctx.beginPath(); ctx.ellipse(0, -L / 2, 3.2, L / 2, 0, 0, Math.PI * 2); ctx.fillStyle = C.buff; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -L + 3, 2.6, 4, 0, 0, Math.PI * 2); ctx.fillStyle = C.black; ctx.fill();
    ctx.restore();
  }
  // head + neck
  ctx.beginPath(); ctx.ellipse(34, -9, 14, 12, 0.2, 0, Math.PI * 2); ctx.fillStyle = C.buff; ctx.fill();
  ctx.beginPath(); ctx.moveTo(20, -10); ctx.quadraticCurveTo(28, 4, 18, 10); ctx.lineTo(10, 8); ctx.fill();
  // bill: long, slender, decurved
  ctx.beginPath(); ctx.moveTo(45, -13); ctx.quadraticCurveTo(66, -12, 84, 4); ctx.quadraticCurveTo(65, -5, 45, -6); ctx.closePath();
  ctx.fillStyle = "#2B2622"; ctx.fill();
  // eye
  ctx.beginPath(); ctx.arc(39, -12, 2.2, 0, Math.PI * 2); ctx.fillStyle = "#111"; ctx.fill();
  // near wing
  if (fold < 1) {
    const a1 = 0.35 + (1 - clamp(flap, -1, 1)) * 0.9; // 0.35 = up and slightly back, ~2.15 = down and back
    ctx.save(); ctx.globalAlpha = 1 - fold; ctx.translate(4, -6); ctx.rotate(-Math.PI / 2 - a1);
    stripedWing(86 * (1 - fold * 0.5), 34, 4); ctx.restore();
  }
  ctx.restore();
}

/* ---------- scene 01: Hoopoe over Mount Hermon (0-4 s) ---------- */
function ridge(y0, amp, freq, seed, color, snow) {
  ctx.beginPath(); ctx.moveTo(-60, H);
  const pts = [];
  for (let x = -60; x <= W + 60; x += 6) { const y = y0 - fbm(x * freq, seed) * amp; pts.push([x, y]); ctx.lineTo(x, y); }
  ctx.lineTo(W + 60, H); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  if (snow) {
    ctx.save(); ctx.clip();
    ctx.beginPath(); ctx.moveTo(-60, -10);
    pts.forEach(([x, y]) => ctx.lineTo(x, y));
    for (let i = pts.length - 1; i >= 0; i--) { const [x, y] = pts[i]; const yy = Math.min(y + snow.depth * (0.7 + 0.6 * fbm(x * 0.03, seed + 3)), snow.line); ctx.lineTo(x, Math.max(y, yy)); }
    ctx.closePath();
    ctx.fillStyle = vgrad(y0 - amp, snow.line, [[0, "#FFF8EE"], [1, "#E9DFD3"]]); ctx.fill();
    ctx.restore();
  }
  return pts;
}
function hermon() {
  // broad massif peaking left of centre; snow only on the upper slopes
  const prof = x => 1150 - 360 * Math.exp(-(((x - 470) / 360) ** 2)) - 120 * Math.exp(-(((x - 900) / 260) ** 2)) - (fbm(x * 0.012, 5) - 0.5) * 50;
  ctx.beginPath(); ctx.moveTo(-60, H); for (let x = -60; x <= W + 60; x += 5) ctx.lineTo(x, prof(x)); ctx.lineTo(W + 60, H); ctx.closePath();
  ctx.fillStyle = vgrad(780, 1160, [[0, "#8F9DA3"], [1, "#6E8287"]]); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.beginPath(); ctx.moveTo(-60, 0);
  for (let x = -60; x <= W + 60; x += 5) ctx.lineTo(x, 905 + (fbm(x * 0.03, 8) - 0.5) * 70 + Math.max(0, Math.sin(x * 0.05)) * 25);
  ctx.lineTo(W + 60, 0); ctx.closePath();
  ctx.fillStyle = vgrad(780, 960, [[0, "#FFF8EE"], [1, "#E3D9CE"]]); ctx.fill();
  ctx.strokeStyle = "rgba(120,135,150,0.35)"; ctx.lineWidth = 3;
  for (let k = 0; k < 9; k++) { const x0 = 250 + k * 45; ctx.beginPath(); ctx.moveTo(x0, prof(x0) + 8); ctx.lineTo(x0 + 30 + k * 4, 960); ctx.stroke(); } // gullies
  ctx.restore();
}
function village(t, rand) {
  const r = rng(42);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = 1300 + r() * 330 + (x / W) * -60;
    const s = 0.6 + (y - 1300) / 330 * 0.9;
    const w = (26 + r() * 26) * s, h = (18 + r() * 14) * s;
    ctx.fillStyle = r() < 0.5 ? "#EADFCB" : "#DCCDB4"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = r() < 0.85 ? C.roof : "#9C4630";
    ctx.beginPath(); ctx.moveTo(x - 3 * s, y); ctx.lineTo(x + w / 2, y - h * 0.55); ctx.lineTo(x + w + 3 * s, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(40,30,20,0.35)"; ctx.fillRect(x + w * 0.3, y + h * 0.35, w * 0.14, h * 0.3);
    if (r() < 0.55) { ctx.fillStyle = r() < 0.5 ? "#33544A" : "#3E5F45"; ctx.beginPath(); ctx.ellipse(x + w + 8 * s, y + h * 0.4, 12 * s, 16 * s, 0, 0, Math.PI * 2); ctx.fill(); }
  }
}
function scene1(lt) {
  const p = lt / 4;
  ctx.save(); camera(1 + 0.05 * ease(p), W / 2, H * 0.55);
  // dawn sky
  ctx.fillStyle = vgrad(0, 1250, [[0, "#1E4A4A"], [0.45, "#4E7C73"], [0.78, "#E7B27A"], [1, "#F6D3A0"]]); ctx.fillRect(-100, -100, W + 200, H + 200);
  // sun
  const sx = 790, sy = 1010 - 40 * ease(p);
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 420); sg.addColorStop(0, "rgba(255,236,200,0.95)"); sg.addColorStop(0.12, "rgba(255,220,160,0.6)"); sg.addColorStop(1, "rgba(255,200,140,0)");
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); ctx.arc(sx, sy, 46, 0, Math.PI * 2); ctx.fillStyle = "#FFF1D6"; ctx.fill();
  // Hermon (far, snow-capped), parallax layers
  ctx.save(); ctx.translate(-12 * p, 0); hermon(); ctx.restore();
  ctx.save(); ctx.translate(-26 * p, 0); ridge(1230, 200, 0.006, 11, "#4D6B66"); ctx.restore();
  ctx.save(); ctx.translate(-44 * p, 0); ridge(1330, 150, 0.009, 17, "#355550"); ctx.restore();
  // haze
  ctx.fillStyle = vgrad(1050, 1350, [[0, "rgba(246,211,160,0)"], [1, "rgba(246,211,160,0.25)"]]); ctx.fillRect(0, 1050, W, 300);
  // Rashaya slope + village
  ctx.save(); ctx.translate(-70 * p, 0);
  ctx.beginPath(); ctx.moveTo(-100, H); ctx.lineTo(-100, 1290); ctx.bezierCurveTo(300, 1250, 700, 1300, W + 200, 1240); ctx.lineTo(W + 200, H); ctx.closePath();
  ctx.fillStyle = vgrad(1240, H, [[0, "#5C6E4E"], [1, "#2F4636"]]); ctx.fill();
  village(lt);
  // foreground trees
  const r = rng(7);
  for (let i = 0; i < 14; i++) { const x = r() * (W + 200) - 100, y = 1700 + r() * 260; ctx.fillStyle = i % 2 ? "#1E3A31" : "#26443A"; ctx.beginPath(); ctx.ellipse(x, y, 90 + r() * 80, 120 + r() * 60, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  // hoopoe: undulating, butterfly-like flight across the foreground
  const bp = clamp((lt - 0.15) / 3.75);
  const bx = lerp(-180, W + 200, bp), by = 860 + Math.sin(bp * Math.PI * 2.2) * 40 - bp * 60;
  const flap = Math.sin(lt * 2 * Math.PI * 3.2) * 0.75 + 0.1;
  hoopoe(bx, by, 2.1, { flap, crest: 0.15, tilt: -0.05 + Math.cos(bp * Math.PI * 2.2) * 0.08 });
  ctx.restore();
  word("الجبل", lt, 4);
  finish();
}

/* ---------- scene 02: the hoopoe lands in golden wheat (4-7 s) ---------- */
function stalk(x, yb, h, lean, sway, s, col, colDark) {
  const tipx = x + lean + sway, tipy = yb - h;
  ctx.strokeStyle = colDark; ctx.lineWidth = 2.2 * s; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, yb); ctx.quadraticCurveTo(x + lean * 0.3, yb - h * 0.55, tipx, tipy); ctx.stroke();
  // ear: alternating kernels along the last part of the stalk
  const ang = Math.atan2(tipy - (yb - h * 0.55), tipx - (x + lean * 0.3));
  ctx.save(); ctx.translate(tipx, tipy); ctx.rotate(ang + Math.PI / 2);
  for (let k = 0; k < 9; k++) {
    const yy = k * 7.5 * s, side = k % 2 ? 1 : -1;
    ctx.fillStyle = k % 3 ? col : colDark;
    ctx.beginPath(); ctx.ellipse(side * 3.4 * s, yy, 3.4 * s, 6.2 * s, side * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(240,210,150,0.7)"; ctx.lineWidth = 0.9 * s;
    ctx.beginPath(); ctx.moveTo(side * 4 * s, yy - 4 * s); ctx.lineTo(side * 14 * s, yy - 26 * s); ctx.stroke();
  }
  ctx.restore();
}
function wheatRows(t, rows, front) {
  rows.forEach(([n, yb, h, s, col, dark, seed]) => {
    const r = rng(seed);
    for (let i = 0; i < n; i++) {
      const x = r() * (W + 120) - 60;
      const gust = Math.sin(t * 1.4 + x * 0.006) * 10 + Math.sin(t * 2.3 + x * 0.013) * 5;
      stalk(x, yb + r() * 40, h * (0.85 + r() * 0.3), (r() - 0.5) * 30, gust * s, s, col, dark);
    }
  });
}
function scene2(lt) {
  const p = lt / 3;
  ctx.save(); camera(1.02 + 0.03 * ease(p), W * 0.62, H * 0.62);
  ctx.fillStyle = vgrad(0, 1100, [[0, "#3F6E68"], [0.6, "#D9A86E"], [1, "#F3CE93"]]); ctx.fillRect(-100, -100, W + 200, H + 200);
  const sg = ctx.createRadialGradient(260, 900, 10, 260, 900, 520); sg.addColorStop(0, "rgba(255,236,200,0.85)"); sg.addColorStop(1, "rgba(255,210,150,0)"); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  ridge(1030, 140, 0.004, 23, "#8C9A8C", { line: 950, depth: 50 });
  ridge(1100, 80, 0.007, 29, "#6E7F67");
  ctx.fillStyle = vgrad(1060, H, [[0, "#C89A4E"], [1, "#8A6428"]]); ctx.fillRect(-100, 1080, W + 200, H);
  wheatRows(lt + 4, [[150, 1180, 150, 0.55, "#E2B866", "#B58A42", 3], [120, 1330, 230, 0.8, "#DDB05C", "#A97C36", 4]]);
  // limestone
  const sx = 690, sy = 1500;
  ctx.beginPath(); ctx.moveTo(sx - 150, sy + 70); ctx.bezierCurveTo(sx - 160, sy - 10, sx - 90, sy - 50, sx, sy - 52); ctx.bezierCurveTo(sx + 100, sy - 54, sx + 165, sy - 10, sx + 160, sy + 70); ctx.closePath();
  ctx.fillStyle = vgrad(sy - 55, sy + 70, [[0, "#EEE5D3"], [1, "#B9AC93"]]); ctx.fill();
  ctx.strokeStyle = "rgba(120,105,85,0.35)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 60, sy - 20); ctx.lineTo(sx - 20, sy + 10); ctx.lineTo(sx + 30, sy); ctx.stroke();
  // hoopoe descends and lands on the stone
  const land = 1.55;
  const dp = clamp(lt / land);
  const bx = lerp(150, sx - 8, easeOut(dp)), by = lerp(620, sy - 88, easeOut(dp) * 0.5 + ease(dp) * 0.5);
  const fold = clamp((lt - land) / 0.45), crest = lt > land + 0.55 ? easeOut((lt - land - 0.55) / 0.35) * (lt < 2.75 ? 1 : 1 - easeOut((lt - 2.75) / 0.25) * 0.4) : 0.2;
  const flap = lt < land ? Math.sin(lt * 2 * Math.PI * (dp > 0.6 ? 4.5 : 3)) * (dp > 0.7 ? 1.0 : 0.6) + (dp > 0.7 ? 0.5 : 0.1) : lerp(0.9, 0, fold);
  hoopoe(bx, by, 2.4, { flap, fold, crest, legs: clamp((dp - 0.75) / 0.2), tilt: lt < land ? -0.25 * (1 - dp) + 0.08 : lerp(0.08, 0, fold) });
  wheatRows(lt + 4, [[26, 1960, 520, 1.6, "#E6BE6C", "#9E7130", 5]]);
  ctx.restore();
  word("القمح", lt, 3);
  finish();
}

/* ---------- scene 03: the stone mill (7-10 s) ---------- */
function scene3(lt) {
  const p = lt / 3;
  ctx.save(); camera(1 + 0.06 * ease(p), W / 2, H * 0.55);
  // limestone wall + warm window light
  ctx.fillStyle = vgrad(0, H, [[0, "#3A3026"], [1, "#1E1813"]]); ctx.fillRect(-100, -100, W + 200, H + 200);
  const r = rng(31);
  for (let y = -40; y < 1500; y += 70) for (let x = -60 + (y / 70 % 2) * 60; x < W + 60; x += 120) {
    ctx.fillStyle = `rgba(${200 + r() * 30},${175 + r() * 30},${140 + r() * 25},${0.10 + r() * 0.06})`; ctx.fillRect(x + 3, y + 3, 114, 64);
  }
  const lg = ctx.createRadialGradient(260, 420, 20, 260, 420, 900); lg.addColorStop(0, "rgba(255,214,150,0.45)"); lg.addColorStop(1, "rgba(255,214,150,0)"); ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, top = 1010;
  // hopper (wooden) feeding the eye
  ctx.fillStyle = C.wood; ctx.beginPath(); ctx.moveTo(cx - 190, 420); ctx.lineTo(cx + 190, 420); ctx.lineTo(cx + 40, 700); ctx.lineTo(cx - 40, 700); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.woodDark; ctx.fillRect(cx - 200, 405, 400, 22);
  ctx.fillStyle = "#C9A56A"; ctx.beginPath(); ctx.ellipse(cx, 425, 180, 22, 0, 0, Math.PI * 2); ctx.fill(); // grain in hopper
  ctx.fillStyle = C.woodDark; ctx.fillRect(cx - 16, 700, 32, 170); // shoe/chute
  // falling kernels into the eye
  const kr = rng(77);
  for (let i = 0; i < 40; i++) { const ph = (kr() + lt * 1.6) % 1; const y = 860 + ph * 150; ctx.fillStyle = "#D2AE6E"; ctx.beginPath(); ctx.ellipse(cx + (kr() - 0.5) * 18, y, 4, 6, kr(), 0, Math.PI * 2); ctx.fill(); }
  // bedstone (stationary) and runner stone (turning)
  const R = 400, ry = 95;
  ctx.fillStyle = vgrad(top + 60, top + 330, [[0, "#BDB19C"], [1, "#7E735F"]]);
  ctx.fillRect(cx - R, top + 120, 2 * R, 200); ctx.beginPath(); ctx.ellipse(cx, top + 320, R, ry, 0, 0, Math.PI); ctx.fill();
  // runner stone side
  ctx.fillStyle = vgrad(top, top + 120, [[0, "#D5CAB5"], [1, "#9C917C"]]);
  ctx.fillRect(cx - R + 10, top, 2 * R - 20, 120); ctx.beginPath(); ctx.ellipse(cx, top + 120, R - 10, ry - 4, 0, 0, Math.PI); ctx.fill();
  // stone texture flecks on the side, moving with rotation
  const rot = lt * 1.15;
  const fr = rng(55);
  for (let i = 0; i < 160; i++) { const a = fr() * Math.PI * 2 + rot; const c = Math.cos(a); if (Math.sin(a) < 0) continue; ctx.fillStyle = `rgba(80,70,55,${0.25 + fr() * 0.3})`; ctx.fillRect(cx + c * (R - 14), top + 10 + fr() * 100, 3 + fr() * 4, 2 + fr() * 3); }
  // runner top surface with radial dressing grooves turning
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, top, R - 10, ry - 4, 0, 0, Math.PI * 2); ctx.fillStyle = "#E2D8C4"; ctx.fill(); ctx.clip();
  ctx.strokeStyle = "rgba(110,98,80,0.55)"; ctx.lineWidth = 4;
  for (let i = 0; i < 16; i++) { const a = rot + i * Math.PI * 2 / 16; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 60, top + Math.sin(a) * 14); ctx.lineTo(cx + Math.cos(a + 0.25) * (R - 20), top + Math.sin(a + 0.25) * (ry - 8)); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(cx, top, 56, 14, 0, 0, Math.PI * 2); ctx.fillStyle = "#4A3F33"; ctx.fill(); // the eye
  // turning handle (rynd) on the runner
  const hx = cx + Math.cos(rot) * (R - 70), hy = top + Math.sin(rot) * (ry - 22), hb = Math.sin(rot) > -0.2;
  ctx.fillStyle = C.wood; ctx.fillRect(hx - 9, hy - (hb ? 120 : 60), 18, hb ? 120 : 60);
  // flour streaming from the gap between stones into the trough
  const gr = rng(91);
  for (let i = 0; i < 260; i++) {
    const side = gr() < 0.5 ? -1 : 1, ph = (gr() + lt * (0.9 + gr() * 0.6)) % 1;
    const x0 = cx + side * (R - 10 - gr() * 30), y0 = top + 120 + gr() * 20;
    const x = x0 + side * ph * 40, y = y0 + ph * ph * 300;
    ctx.fillStyle = `rgba(245,236,220,${0.65 * (1 - ph * 0.6)})`; ctx.fillRect(x, y, 3, 3);
    if (gr() < 0.18) { ctx.fillStyle = `rgba(150,110,60,${0.6 * (1 - ph)})`; ctx.fillRect(x + 2, y + 1, 2, 2); } // bran flecks
  }
  // wooden trough with growing whole-wheat flour
  ctx.fillStyle = C.woodDark; ctx.beginPath(); ctx.ellipse(cx, top + 520, R + 90, 80, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.wood; ctx.fillRect(cx - R - 90, top + 520, 2 * R + 180, 110); ctx.beginPath(); ctx.ellipse(cx, top + 630, R + 90, 80, 0, 0, Math.PI); ctx.fill();
  const m = 0.55 + 0.45 * p;
  ctx.fillStyle = "#EADBC0"; ctx.beginPath(); ctx.ellipse(cx, top + 520, (R + 60) * m, 58 * m, 0, 0, Math.PI * 2); ctx.fill();
  const fl = rng(12); for (let i = 0; i < 120; i++) { const a = fl() * Math.PI * 2, rr = Math.sqrt(fl()); ctx.fillStyle = "rgba(140,100,55,0.5)"; ctx.fillRect(cx + Math.cos(a) * rr * (R + 50) * m, top + 520 + Math.sin(a) * rr * 50 * m, 2, 2); }
  ctx.restore();
  word("الطحين", lt, 3);
  finish();
}

/* ---------- scene 04: salt, water, kneading (10-13 s) ---------- */
function bowl(cx, cy, R) {
  ctx.fillStyle = vgrad(cy - R, cy + R, [[0, "#8B5A34"], [1, "#5A3720"]]); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,220,170,0.25)"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, R - 10, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();
  ctx.fillStyle = "#4A2D18"; ctx.beginPath(); ctx.arc(cx, cy, R - 34, 0, Math.PI * 2); ctx.fill();
}
function flourBed(cx, cy, R, wet) {
  ctx.fillStyle = C.flour; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  const fl = rng(4); for (let i = 0; i < 380; i++) { const a = fl() * Math.PI * 2, rr = Math.sqrt(fl()) * R; ctx.fillStyle = "rgba(150,108,62,0.55)"; ctx.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 2.5, 2.5); }
  if (wet > 0) { ctx.fillStyle = "rgba(200,170,120,0.85)"; ctx.beginPath(); ctx.arc(cx, cy, R * 0.55 * wet, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, R * 0.5 * wet, 0, Math.PI * 2); ctx.stroke(); }
}
function table() {
  ctx.fillStyle = vgrad(0, H, [[0, "#6E4A2E"], [1, "#3B2616"]]); ctx.fillRect(-100, -100, W + 200, H + 200);
  const r = rng(3); ctx.strokeStyle = "rgba(30,18,8,0.35)"; ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) { const y = r() * H; ctx.beginPath(); ctx.moveTo(-50, y); ctx.bezierCurveTo(300, y + (r() - 0.5) * 40, 700, y + (r() - 0.5) * 40, W + 50, y + (r() - 0.5) * 20); ctx.stroke(); }
  const lg = ctx.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.45, 900); lg.addColorStop(0, "rgba(255,220,170,0.28)"); lg.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
}
function hand(x, y, s, rot, press) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s * (1 - press * 0.08));
  ctx.fillStyle = "#C98E68";
  ctx.fillRect(-55, -420, 110, 330); // forearm
  ctx.fillStyle = "#7F5A45"; ctx.fillRect(-60, -440, 120, 70); // rolled sleeve
  ctx.fillStyle = "#D39A72";
  ctx.beginPath(); ctx.ellipse(0, -60, 80, 95, 0, 0, Math.PI * 2); ctx.fill(); // palm/back of hand
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(-48 + k * 32, 22, 17, 30, 0, 0, Math.PI * 2); ctx.fill(); } // curled fingers (fist)
  ctx.strokeStyle = "rgba(120,70,45,0.45)"; ctx.lineWidth = 3;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-32 + k * 32, 0); ctx.lineTo(-32 + k * 32, 40); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(70, -40, 22, 48, -0.5, 0, Math.PI * 2); ctx.fillStyle = "#CC9169"; ctx.fill(); // thumb
  ctx.fillStyle = "rgba(245,236,220,0.55)"; ctx.beginPath(); ctx.ellipse(0, 30, 60, 18, 0, 0, Math.PI * 2); ctx.fill(); // flour dust on knuckles
  ctx.restore();
}
function scene4(lt) {
  table();
  const cx = W / 2, cy = H * 0.56, R = 400;
  ctx.save(); camera(1 + 0.04 * ease(lt / 3), cx, cy);
  bowl(cx, cy, R);
  if (lt < 1.5) {
    const wet = clamp((lt - 0.75) / 0.75);
    flourBed(cx, cy, R - 40, easeOut(wet));
    if (lt < 0.75) { // salt pinch falling
      const sr = rng(19);
      for (let i = 0; i < 70; i++) { const d = sr() * 0.5, ph = clamp((lt - d) / 0.45); if (ph <= 0) continue;
        const x = cx + 90 + (sr() - 0.5) * 70 * (0.3 + ph), y = lerp(-40, cy - 30 + (sr() - 0.5) * 60, easeIn(ph));
        ctx.save(); ctx.translate(x, y); ctx.rotate(sr() * 3); ctx.fillStyle = ph < 1 ? "#FFFFFF" : "rgba(255,255,255,0.8)"; ctx.fillRect(-4, -4, 8, 8); ctx.strokeStyle = "rgba(160,190,210,0.6)"; ctx.strokeRect(-4, -4, 8, 8); ctx.restore(); }
    } else { // water pouring from a clay jug
      const pr = clamp((lt - 0.75) / 0.75);
      ctx.save(); ctx.translate(cx + 400, 250); ctx.rotate(-0.9);
      ctx.fillStyle = "#B4673F"; ctx.beginPath(); ctx.ellipse(0, 0, 150, 190, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#9A5332"; ctx.fillRect(-40, -230, 80, 70); ctx.beginPath(); ctx.moveTo(-40, -220); ctx.lineTo(-90, -270); ctx.lineTo(-30, -250); ctx.fill();
      ctx.strokeStyle = "rgba(255,230,200,0.3)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 120, 3.6, 4.6); ctx.stroke();
      ctx.restore();
      const sx = cx + 132, sy = 160; // jug spout
      ctx.strokeStyle = "rgba(190,225,235,0.85)"; ctx.lineWidth = 16 + Math.sin(lt * 40) * 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 10, sy + 260, cx + 10, cy - 10); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sx + 4, sy + 10); ctx.quadraticCurveTo(sx + 16, sy + 260, cx + 14, cy - 14); ctx.stroke();
      for (let k = 0; k < 3; k++) { const rr = ((lt * 2.2 + k / 3) % 1); ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - rr)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(cx + 10, cy, 30 + rr * 150 * pr, 12 + rr * 60 * pr, 0, 0, Math.PI * 2); ctx.stroke(); }
    }
  } else { // kneading
    const kt = lt - 1.5;
    flourBed(cx, cy, R - 40, 0);
    const beat = kt * 2.4; // press cycles per second
    const ph = beat % 1, which = Math.floor(beat) % 2;
    const press = Math.sin(Math.PI * ph);
    // dough ball, squashed by each press
    ctx.save(); ctx.translate(cx, cy + 10); ctx.scale(1 + press * 0.12, 1 - press * 0.08);
    ctx.fillStyle = vgrad(-200, 200, [[0, "#F0DCB6"], [1, "#CFAF80"]]); ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.1) { const rr = 230 + Math.sin(a * 3 + kt * 2) * 10 + Math.sin(a * 5 - kt) * 6; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.85); }
    ctx.fill();
    ctx.strokeStyle = "rgba(160,120,75,0.45)"; ctx.lineWidth = 5;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(-40 + k * 30, -10 + k * 20, 120 - k * 25, 0.5 + kt * 0.6 + k, 1.9 + kt * 0.6 + k); ctx.stroke(); } // folds
    const fr = rng(8); ctx.fillStyle = "rgba(140,100,55,0.45)"; for (let i = 0; i < 90; i++) ctx.fillRect((fr() - 0.5) * 380, (fr() - 0.5) * 320, 2.5, 2.5);
    ctx.restore();
    // two hands pressing alternately with the heel of the palm
    hand(cx - 130, cy - 30 + (which === 0 ? press * 50 : 0), 1, -0.42, which === 0 ? press : 0);
    hand(cx + 130, cy - 30 + (which === 1 ? press * 50 : 0), 1, 0.42, which === 1 ? press : 0);
    // flour puffs on each press
    const pr2 = rng(Math.floor(beat) + 100);
    for (let i = 0; i < 25; i++) { const a = pr2() * Math.PI * 2, d = 230 + ph * 120 * pr2(); ctx.fillStyle = `rgba(250,244,232,${0.4 * (1 - ph)})`; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, 4 + pr2() * 6, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
  word(lt < 0.75 ? "الملح" : lt < 1.5 ? "الماء" : "العجين", lt < 0.75 ? lt : lt < 1.5 ? lt - 0.75 + 0.5 : lt - 1.5, lt < 0.75 ? 0.75 : lt < 1.5 ? 1.25 : 1.5);
  finish();
}

/* ---------- scene 05: saj over the wood fire (13-17 s) ---------- */
function flame(x, y, h, w, t, seed, col) {
  ctx.beginPath(); ctx.moveTo(x - w, y);
  const n = 14;
  for (let i = 0; i <= n; i++) { const u = i / n; const yy = y - h * u; const sway = (fbm(t * 2.2 + u * 2, seed) - 0.5) * w * 1.4 * u; ctx.lineTo(x - w * (1 - u) ** 0.8 + sway, yy); }
  for (let i = n; i >= 0; i--) { const u = i / n; const yy = y - h * u; const sway = (fbm(t * 2.2 + u * 2, seed) - 0.5) * w * 1.4 * u; ctx.lineTo(x + w * (1 - u) ** 0.8 + sway, yy); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
function scene5(lt) {
  const p = lt / 4;
  ctx.save(); camera(1 + 0.07 * ease(p), W / 2, H * 0.6);
  ctx.fillStyle = vgrad(0, H, [[0, "#1A2422"], [1, "#0C100F"]]); ctx.fillRect(-100, -100, W + 200, H + 200);
  const cx = W / 2, domeY = 1130, R = 470;
  // fire glow
  const fg = ctx.createRadialGradient(cx, 1400, 30, cx, 1400, 800); fg.addColorStop(0, `rgba(255,150,60,${0.55 + 0.08 * Math.sin(lt * 9)})`); fg.addColorStop(1, "rgba(255,120,40,0)"); ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  // support stones + logs
  ctx.fillStyle = "#5E574C"; [[-330, 0], [330, 0], [0, 60]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.ellipse(cx + dx, 1450 + dy, 90, 70, 0, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = "#3A2617"; ctx.save(); ctx.translate(cx, 1500); ctx.rotate(0.12); ctx.fillRect(-280, -20, 560, 40); ctx.rotate(-0.3); ctx.fillRect(-260, -18, 520, 36); ctx.restore();
  // controlled small flames under the dome
  [["rgba(200,70,30,0.85)", 135, 60], ["rgba(240,130,40,0.9)", 100, 44], ["rgba(255,210,110,0.95)", 62, 26]].forEach(([col, h, w], j) => {
    for (let k = -2; k <= 2; k++) flame(cx + k * 100, 1495, h * (0.7 + 0.3 * noise1(k + 5, j)) * (1 - Math.abs(k) * 0.12), w, lt + k * 0.37, 10 + k + j * 5, col);
  });
  // embers rising
  const er = rng(66); for (let i = 0; i < 26; i++) { const ph = (er() + lt * (0.3 + er() * 0.4)) % 1; const x = cx + (er() - 0.5) * 480 + Math.sin(ph * 8 + i) * 20; const y = 1480 - ph * 500; ctx.fillStyle = `rgba(255,${150 + er() * 80},60,${(1 - ph) * 0.9})`; ctx.fillRect(x, y, 3, 3); }
  // the convex saj dome (dark steel)
  ctx.beginPath(); ctx.ellipse(cx, domeY + 120, R, 190, 0, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = vgrad(domeY - 70, domeY + 120, [[0, "#4A4643"], [1, "#1C1A19"]]); ctx.fill();
  ctx.strokeStyle = "rgba(255,170,90,0.55)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(cx, domeY + 120, R, 190, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke(); // fire-lit rim
  // the very thin bread, draped over the dome
  ctx.save();
  ctx.beginPath(); ctx.moveTo(cx - R - 40, domeY + 150); ctx.bezierCurveTo(cx - R + 10, domeY - 40, cx - 200, domeY - 82, cx, domeY - 84);
  ctx.bezierCurveTo(cx + 200, domeY - 82, cx + R - 10, domeY - 40, cx + R + 40, domeY + 150);
  ctx.bezierCurveTo(cx + R + 20, domeY + 158, cx + R - 10, domeY + 138, cx + R - 30, domeY + 120);
  ctx.bezierCurveTo(cx + 200, domeY - 60, cx - 200, domeY - 60, cx - R + 30, domeY + 120);
  ctx.bezierCurveTo(cx - R + 10, domeY + 138, cx - R - 20, domeY + 158, cx - R - 40, domeY + 150); ctx.closePath();
  ctx.fillStyle = vgrad(domeY - 90, domeY + 150, [[0, "#E9CFA0"], [1, "#C99E62"]]); ctx.fill(); ctx.clip();
  // bubbles rise, then brown into golden spots
  const br = rng(123);
  for (let i = 0; i < 140; i++) {
    const u = br(), born = br() * 2.6, x = cx + (u - 0.5) * 2 * (R + 20), y = domeY + 150 - Math.sqrt(Math.max(0, 1 - ((x - cx) / (R + 30)) ** 2)) * 230 + br() * 60;
    const age = lt - born; if (age < 0) continue;
    const g = clamp(age / 0.6), brown = clamp((age - 0.5) / 1.2), rr = 4 + br() * 13;
    ctx.fillStyle = `rgba(${lerp(245, 150, brown)},${lerp(225, 95, brown)},${lerp(180, 45, brown)},${0.35 + 0.5 * g})`;
    ctx.beginPath(); ctx.ellipse(x, y, rr * g, rr * 0.7 * g, 0, 0, Math.PI * 2); ctx.fill();
    if (brown < 0.4) { ctx.fillStyle = `rgba(255,255,240,${0.5 * g * (1 - brown * 2.5)})`; ctx.beginPath(); ctx.arc(x - rr * 0.3, y - rr * 0.25, rr * 0.25 * g, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
  // faint heat shimmer lines
  ctx.strokeStyle = "rgba(255,230,200,0.07)"; ctx.lineWidth = 3;
  for (let k = 0; k < 6; k++) { ctx.beginPath(); for (let y = 0; y < 300; y += 10) { const x = cx - 300 + k * 120 + Math.sin(y * 0.04 + lt * 5 + k) * 10; y === 0 ? ctx.moveTo(x, domeY - 120 - y) : ctx.lineTo(x, domeY - 120 - y); } ctx.stroke(); }
  // stack of finished saj at the side, thin layered sheets
  ctx.save(); ctx.translate(cx + 300, 1720);
  for (let k = 0; k < 14; k++) { ctx.fillStyle = k % 2 ? "#D9B57E" : "#C79C5E"; ctx.beginPath(); ctx.ellipse(0, -k * 6, 230, 50, 0, 0, Math.PI * 2); ctx.fill(); }
  const sr = rng(5); for (let i = 0; i < 40; i++) { ctx.fillStyle = "rgba(140,85,40,0.6)"; ctx.beginPath(); ctx.ellipse((sr() - 0.5) * 380, -84 + (sr() - 0.5) * 70, 4 + sr() * 8, 3 + sr() * 5, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
  ctx.restore();
  word("النار", lt, 4);
  finish(0.05);
}

/* ---------- timeline ---------- */
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (t < 4) scene1(t);
  else if (t < 7) scene2(t - 4);
  else if (t < 10) scene3(t - 7);
  else if (t < 13) scene4(t - 10);
  else scene5(t - 13);
};
window.ready = document.fonts.load("64px Amiri").then(() => { render(0); return true; });
</script>
</body>
</html>
